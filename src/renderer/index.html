<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' buyiaudio: file: data:; img-src 'self' data: file: https: http:; media-src 'self' buyiaudio: file: http: https: blob:; style-src 'self' 'unsafe-inline'">
<title>布依音 · 布依族民族音乐</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3.5v16H7zm6.5 0H17v16h-3.5z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L20 5.2v13.6z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5.2 14.5 12 4 18.8z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.3-9A5.4 5.4 0 0 1 12 6.3 5.4 5.4 0 0 1 21.3 12c-1.8 4.3-9.3 9-9.3 9z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.3-9A5.4 5.4 0 0 1 12 6.3 5.4 5.4 0 0 1 21.3 12c-1.8 4.3-9.3 9-9.3 9z"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-loop" viewBox="0 0 24 24"><path d="M4 9h12a3 3 0 0 1 3 3v1M4 9l3-3M4 9l3 3M20 15H8a3 3 0 0 1-3-3v-1m15 4l-3 3m3-3l-3-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h4l10 12h4M3 18h4l3-3.6M14 9.6L17 6h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M17 3l3 3-3 3M17 15l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-single" viewBox="0 0 24 24"><path d="M4 9h12a3 3 0 0 1 3 3v1M4 9l3-3M4 9l3 3M20 15H8a3 3 0 0 1-3-3v-1m15 4l-3 3m3-3l-3-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><text x="12" y="16" font-size="8" fill="currentColor" text-anchor="middle" font-family="sans-serif">1</text></symbol>
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
  <symbol id="i-heart-side" viewBox="0 0 24 24"><path d="M12 20.5S4.5 15.8 2.7 11.5A5.4 5.4 0 0 1 12 5.8a5.4 5.4 0 0 1 9.3 5.7c-1.8 4.3-9.3 9-9.3 9z" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5.5l4 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2 2 0 0 1 6 3.5h12v15H6a2 2 0 0 0-2 2z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 18.5a2 2 0 0 0 2 2h12v-17" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</svg>

<div class="app">

  <!-- 顶栏 -->
  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="28" height="28">
          <circle cx="20" cy="20" r="18" fill="#16324B"/>
          <circle cx="20" cy="20" r="12" fill="none" stroke="#C9A227" stroke-width="2"/>
          <circle cx="20" cy="20" r="4.5" fill="#C8362F"/>
          <g stroke="#F6F1E7" stroke-width="2" stroke-linecap="round">
            <line x1="20" y1="4" x2="20" y2="9"/><line x1="20" y1="31" x2="20" y2="36"/>
            <line x1="4" y1="20" x2="9" y2="20"/><line x1="31" y1="20" x2="36" y2="20"/>
            <line x1="8.7" y1="8.7" x2="12.2" y2="12.2"/><line x1="27.8" y1="27.8" x2="31.3" y2="31.3"/>
            <line x1="8.7" y1="31.3" x2="12.2" y2="27.8"/><line x1="27.8" y1="12.2" x2="31.3" y2="8.7"/>
          </g>
        </svg>
      </span>
      <span class="brand-text">布依音<small>BUYI MUSIC</small></span>
    </div>

    <div class="tb-nav">
      <button class="tb-arrow" id="navBack" title="返回"><svg><use href="#i-back"/></svg></button>
    </div>

    <div class="tb-drag"></div>

    <div class="searchbox">
      <svg class="sb-icon"><use href="#i-search"/></svg>
      <input id="searchInput" type="text" placeholder="搜索布依族歌曲、歌手、专辑" autocomplete="off">
      <div class="sb-panel" id="searchPanel"></div>
    </div>

    <div class="winbtns">
      <button id="btnMin" title="最小化"><svg><use href="#i-min"/></svg></button>
      <button id="btnMax" title="最大化"><svg><use href="#i-max"/></svg></button>
      <button id="btnClose" class="close" title="关闭"><svg><use href="#i-close"/></svg></button>
    </div>
  </header>

  <div class="mainwrap">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <nav class="side-scroll">
        <div class="side-group">
          <div class="side-title">在线音乐</div>
          <a class="side-item active" data-view="home"><svg><use href="#i-home"/></svg><span>推荐</span></a>
          <a class="side-item" data-view="library"><svg><use href="#i-disc"/></svg><span>全部曲库</span></a>
          <a class="side-item" data-view="culture"><svg><use href="#i-book"/></svg><span>布依族文化</span></a>
        </div>
        <div class="side-group">
          <div class="side-title">我的音乐</div>
          <a class="side-item" data-view="favorites"><svg><use href="#i-heart-side"/></svg><span>我喜欢的</span></a>
          <a class="side-item" data-view="history"><svg><use href="#i-clock"/></svg><span>播放历史</span></a>
          <a class="side-item" data-view="cache"><svg><use href="#i-folder"/></svg><span>本地缓存</span></a>
        </div>
        <div class="side-group">
          <div class="side-title">民族歌单</div>
          <div id="playlistNav"></div>
        </div>
      </nav>
      <div class="side-foot">
        <div class="batik-strip"></div>
        <div class="side-stat" id="sideStat">载入中…</div>
      </div>
    </aside>

    <!-- 内容区 -->
    <main class="content" id="content">

      <!-- 推荐 -->
      <section class="view" id="view-home">
        <div class="hero" id="hero"></div>

        <div class="sec-head">
          <h2>今日推荐 <em>好花红 · 布依族的声音</em></h2>
          <div class="sec-tools">
            <button class="ghost-btn" id="btnPlayDaily"><svg><use href="#i-play"/></svg>播放全部</button>
          </div>
        </div>
        <div class="card-grid" id="dailyGrid"></div>

        <div class="sec-head"><h2>民族歌单</h2></div>
        <div class="pl-grid" id="plGrid"></div>

        <div class="sec-head"><h2>曲库精选</h2></div>
        <div class="track-table" id="homeTracks"></div>
      </section>

      <!-- 歌单 / 全部 / 收藏 / 历史 / 缓存 / 搜索 -->
      <section class="view hidden" id="view-detail">
        <div class="detail-head" id="detailHead"></div>
        <div class="track-table" id="detailTracks"></div>
      </section>

      <!-- 文化 -->
      <section class="view hidden" id="view-culture">
        <div class="culture-page" id="culturePage"></div>
      </section>

    </main>
  </div>

  <!-- 播放条 -->
  <footer class="playerbar">
    <div class="pb-left">
      <div class="pb-cover" id="pbCover"><div class="pb-cover-ph">布</div></div>
      <div class="pb-meta">
        <div class="pb-title" id="pbTitle">布依音 · 待播放</div>
        <div class="pb-artist" id="pbArtist">选择一首布依族民歌开始聆听</div>
      </div>
      <button class="pb-heart" id="pbHeart" title="喜欢"><svg><use href="#i-heart"/></svg></button>
    </div>

    <div class="pb-center">
      <div class="pb-ctrls">
        <button id="btnPrev" title="上一首"><svg><use href="#i-prev"/></svg></button>
        <button id="btnPlay" class="playbtn" title="播放/暂停"><svg id="playIcon"><use href="#i-play"/></svg></button>
        <button id="btnNext" title="下一首"><svg><use href="#i-next"/></svg></button>
        <button id="btnMode" class="modebtn" title="播放模式"><svg id="modeIcon"><use href="#i-loop"/></svg></button>
      </div>
      <div class="pb-progress">
        <span class="t" id="timeCur">00:00</span>
        <div class="bar" id="seekBar"><div class="bar-inner" id="seekFill"><i class="dot"></i></div></div>
        <span class="t" id="timeAll">00:00</span>
      </div>
    </div>

    <div class="pb-right">
      <button id="btnLyric" class="pb-btn" title="歌词">词</button>
      <button id="btnMute" class="pb-btn" title="静音"><svg id="volIcon"><use href="#i-volume"/></svg></button>
      <div class="volbar" id="volBar"><div class="vol-inner" id="volFill"><i class="dot"></i></div></div>
      <button id="btnQueue" class="pb-btn" title="播放列表"><svg><use href="#i-list"/></svg></button>
    </div>
  </footer>

  <!-- 播放页 -->
  <div class="playerpage hidden" id="playerPage">
    <div class="pp-bg" id="ppBg"></div>
    <div class="pp-top">
      <button class="pp-close" id="ppClose"><svg><use href="#i-back"/></svg>收起</button>
    </div>
    <div class="pp-body">
      <div class="pp-left">
        <div class="disc-wrap">
          <div class="disc" id="disc">
            <div class="disc-face">
              <svg viewBox="0 0 200 200" class="disc-pattern">
                <circle cx="100" cy="100" r="96" fill="none" stroke="#C9A227" stroke-width="1.5" opacity=".7"/>
                <circle cx="100" cy="100" r="76" fill="none" stroke="#C9A227" stroke-width="1" opacity=".5"/>
                <circle cx="100" cy="100" r="58" fill="none" stroke="#C9A227" stroke-width="1" opacity=".35"/>
                <g stroke="#C9A227" stroke-width="2" opacity=".55">
                  <line x1="100" y1="12" x2="100" y2="30"/>
                  <line x1="100" y1="170" x2="100" y2="188"/>
                  <line x1="12" y1="100" x2="30" y2="100"/>
                  <line x1="170" y1="100" x2="188" y2="100"/>
                </g>
                <circle cx="100" cy="100" r="18" fill="none" stroke="#C8362F" stroke-width="2" opacity=".8"/>
              </svg>
              <img id="discCover" alt="">
            </div>
          </div>
          <div class="tonearm"></div>
        </div>
      </div>
      <div class="pp-right">
        <h1 id="ppTitle">—</h1>
        <div class="pp-sub"><span id="ppArtist"></span> · <span id="ppAlbum"></span></div>
        <div class="lyric-box" id="lyricBox">
          <div class="lyric-line active">布依族民歌 · 好花红</div>
          <div class="lyric-line">纯音乐，请欣赏</div>
        </div>
        <div class="pp-ctrl">
          <button id="ppPrev"><svg><use href="#i-prev"/></svg></button>
          <button id="ppPlay" class="playbtn big"><svg id="ppPlayIcon"><use href="#i-play"/></svg></button>
          <button id="ppNext"><svg><use href="#i-next"/></svg></button>
          <button id="ppFav" title="喜欢"><svg><use href="#i-heart"/></svg></button>
          <button id="ppDl" title="缓存到本地"><svg><use href="#i-download"/></svg></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 播放队列 -->
  <div class="queue-panel hidden" id="queuePanel">
    <div class="qp-head"><span>播放队列</span><button id="qpClose">×</button></div>
    <div class="qp-list" id="qpList"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
